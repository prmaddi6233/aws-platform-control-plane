[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-control-plane"
version = "0.1.0"
description = "Self-service AWS account lifecycle control plane"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Pradeep Maddi" }]

dependencies = [
  "pydantic>=2.7,<3",
  "boto3>=1.34,<2",
  "structlog>=24.1,<27",
]

[project.scripts]
control-plane = "platform_control_plane.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<8",
  "moto[dynamodb,stepfunctions,organizations,iam,sns,sqs]>=5.0,<6",
  "ruff>=0.5,<1",
  "mypy>=1.10,<3",
  "boto3-stubs[dynamodb,stepfunctions,organizations,iam,sns,sqs]>=1.34,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/platform_control_plane"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "TCH", # type-checking imports
  "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
  "unit: Unit tests (no external dependencies)",
  "integration: Integration tests (may use moto or localstack)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
